# Exactly-once Kafka → keyed windowed aggregation → transactional Kafka.
# Logic (parseOrder, isValidOrder, byCustomer, sumAmount) is referenced
# by name and resolved against a registry at compile time.
name: order-totals
version: "1"

env:
  bufferSize: 2048
  shutdownTimeout: 30s
  checkpointing:
    interval: 30s
    dir: /var/lib/weibo/checkpoints
  state:
    backend: pebble
    dir: /var/lib/weibo/state

source:
  type: kafka
  kafka:
    brokers: [localhost:9092]
    topic: orders
    groupID: order-totals
    startFrom: earliest
    exactlyOnce: true
    deserialize: json
    watermark:
      maxOutOfOrderness: 1s
      interval: 500ms

pipeline:
  - id: completed-only
    type: filter
    filter:
      field: status
      operator: equals
      value: completed
  - id: by-customer
    type: keyBy
    keyBy:
      field: customer_id
      partitions: 8
  - id: window
    type: window
    window:
      type: tumbling
      size: 5m
  - id: totals
    type: reduce
    reduce:
      function: sum
      field: amount

sink:
  type: txnKafka
  txnKafka:
    brokers: [localhost:9092]
    topic: order-totals
    transactionalID: order-totals-pipeline
    serialize: json
