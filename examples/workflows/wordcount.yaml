name: wordcount
version: "1"

source:
  type: generator
  records:
    - {key: hello, value: '{"word":"hello"}'}
    - {key: weibo, value: '{"word":"weibo"}'}
    - {key: hello, value: '{"word":"hello"}'}

pipeline:
  - id: by-word
    type: keyBy
    keyBy: {field: word, partitions: 1}
  - id: count
    type: reduce
    reduce: {function: count}

sink:
  type: stdout
