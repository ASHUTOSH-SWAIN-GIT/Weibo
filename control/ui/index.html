<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAILER // CONTROL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314110d'/%3E%3Crect x='3' y='6' width='10' height='4' fill='%23e0a53d'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#14110d; --panel:#1b1712; --panel2:#221d16; --line:#39301f;
    --ink:#ece2cf; --muted:#8f8472; --dim:#5f574a;
    --amber:#e0a53d; --green:#63d090; --red:#e0573d; --steel:#7fb0d8; --violet:#b79ae0;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--mono);
    font-size:13px; line-height:1.5;
    background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
    background-size:34px 34px;
  }
  a{color:inherit;text-decoration:none}
  .hazard{height:6px;background:repeating-linear-gradient(45deg,var(--amber) 0 14px,#14110d 14px 28px)}
  /* top bar */
  header{display:flex;align-items:center;gap:22px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{font-weight:800;letter-spacing:.14em;font-size:15px;font-family:system-ui,var(--mono)}
  .brand b{color:var(--amber)}
  nav{display:flex;gap:6px;margin-left:auto}
  nav a{padding:6px 14px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:11px}
  nav a.on{color:var(--bg);background:var(--amber);border-color:var(--amber);font-weight:700}
  .count{color:var(--dim);text-transform:uppercase;letter-spacing:.14em;font-size:11px}
  main{max-width:1100px;margin:0 auto;padding:26px 22px 60px}
  /* panels */
  .panel{border:1px solid var(--line);background:var(--panel)}
  .panel>.hd{padding:9px 14px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.16em;font-size:10.5px;color:var(--muted);background:var(--panel2)}
  .grid{display:grid;gap:16px}
  h1{font-family:system-ui,var(--mono);font-weight:800;letter-spacing:.02em;font-size:22px;margin:0}
  .sub{color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  /* table */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:10px 14px;border-bottom:1px solid var(--line)}
  td{padding:12px 14px;border-bottom:1px solid var(--line)}
  tr.row{cursor:pointer}
  tr.row:hover td{background:var(--panel2)}
  .name{font-weight:700;color:var(--ink)}
  .mono-dim{color:var(--dim);font-size:11px}
  /* LED + badges */
  .led{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle;box-shadow:0 0 8px currentColor}
  .phase{display:inline-flex;align-items:center;text-transform:uppercase;letter-spacing:.1em;font-size:11px}
  .p-running{color:var(--green)} .p-starting,.p-cancelling{color:var(--amber)}
  .p-finished{color:var(--steel)} .p-failed{color:var(--red)}
  .p-cancelled,.p-submitted,.p-none{color:var(--muted)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .p-running .led{animation:pulse 1.1s ease-in-out infinite}
  .badge{display:inline-block;padding:3px 9px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.1em;font-size:10px}
  .d-exactly-once{color:var(--green)} .d-at-least-once{color:var(--steel)} .d-at-most-once{color:var(--muted)}
  /* buttons */
  .btn{font-family:var(--mono);cursor:pointer;padding:8px 15px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);text-transform:uppercase;letter-spacing:.1em;font-size:11px}
  .btn:hover{border-color:var(--amber);color:var(--amber)}
  .btn.pri{background:var(--amber);color:var(--bg);border-color:var(--amber);font-weight:700}
  .btn.pri:hover{background:#efbb5c}
  .btn.danger:hover{border-color:var(--red);color:var(--red)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  /* pipeline graph */
  .flow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:18px 14px}
  .node{border:1px solid var(--line);padding:9px 13px;background:var(--panel2);min-width:74px;text-align:center}
  .node .t{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .node .n{font-weight:700;margin-top:2px}
  .node.src{border-color:#4a5f3a}.node.snk{border-color:#5a4438}
  .arrow{color:var(--amber);font-size:15px}
  /* kv */
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;padding:14px}
  .kv dt{color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-size:10px;align-self:center}
  .kv dd{margin:0;font-weight:600}
  .big{font-size:20px;font-weight:800;color:var(--amber)}
  /* logs + transitions */
  pre.log{margin:0;padding:14px;max-height:280px;overflow:auto;font-size:11.5px;color:var(--muted);white-space:pre-wrap;word-break:break-all}
  .tl{padding:12px 14px;font-size:11.5px}
  .tl .r{display:flex;gap:10px;padding:3px 0;color:var(--muted)}
  .tl .r b{color:var(--ink);min-width:82px}
  .tl .r .at{margin-left:auto;color:var(--dim)}
  /* forms */
  textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-family:var(--mono);font-size:12.5px;padding:12px;resize:vertical}
  textarea:focus{outline:none;border-color:var(--amber)}
  label.fld{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
  .note{color:var(--dim);font-size:11px;margin-top:6px}
  .err{color:var(--red);border:1px solid var(--red);padding:10px 13px;font-size:12px;white-space:pre-wrap}
  .ok{color:var(--green)}
  .empty{padding:40px 14px;text-align:center;color:var(--dim);letter-spacing:.06em}
  .back{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .back:hover{color:var(--amber)}
</style>
</head>
<body>
<div class="hazard"></div>
<header>
  <div class="brand">MAILER <b>//</b> CONTROL</div>
  <span class="count" id="count"></span>
  <nav id="nav">
    <a href="#/jobs" data-v="jobs">Jobs</a>
    <a href="#/submit" data-v="submit">Submit</a>
  </nav>
</header>
<main id="app"></main>

<script>
const $ = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const g=(o,...k)=>{for(const x of k){if(o&&o[x]!=null)return o[x]}return undefined};

const api={
  jobs:()=>fetch('/jobs').then(r=>r.json()),
  job:(id)=>fetch('/jobs/'+id).then(r=>r.json()),
  state:(id)=>fetch('/jobs/'+id+'/state').then(r=>r.ok?r.json():null).catch(()=>null),
  logs:(id)=>fetch('/jobs/'+id+'/logs?tail=200').then(r=>r.text()).catch(()=>''),
  validate:(b)=>fetch('/validate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),
  submit:(b)=>fetch('/jobs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),
  act:(id,a,b)=>fetch('/jobs/'+id+'/'+a,{method:'POST',headers:b?{'content-type':'application/json'}:{},body:b?JSON.stringify(b):null}),
};

const app=document.getElementById('app');
let timer=null;
function stopPoll(){if(timer){clearInterval(timer);timer=null}}
function poll(fn,ms){stopPoll();fn();timer=setInterval(fn,ms)}

function phaseEl(p){p=(p||'—').toLowerCase();const cls=({'—':'none'}[p])||p;
  return `<span class="phase p-${esc(cls)}"><span class="led"></span>${esc(p)}</span>`}

function graphEl(gr){
  if(!gr)return '';
  const src=g(gr,'Source','source'), snk=g(gr,'Sink','sink'), ops=g(gr,'Operators','operators')||[];
  const node=(t,n,c)=>`<div class="node ${c||''}"><div class="t">${esc(t)}</div><div class="n">${esc(n)}</div></div>`;
  const arr='<span class="arrow">─▶</span>';
  let parts=[node('source',src,'src')];
  ops.forEach(o=>parts.push(arr,node(g(o,'Type','type'),g(o,'ID','id'))));
  parts.push(arr,node('sink',snk,'snk'));
  return `<div class="flow">${parts.join('')}</div>`;
}

/* ---- jobs list ---- */
async function viewJobs(){
  setNav('jobs');
  poll(async()=>{
    let d;try{d=await api.jobs()}catch(e){app.innerHTML=`<div class="err">controller unreachable</div>`;return}
    const jobs=d.jobs||[];
    document.getElementById('count').textContent=jobs.length+' job'+(jobs.length===1?'':'s');
    if(!jobs.length){app.innerHTML=`<div class="panel"><div class="hd">Jobs</div><div class="empty">No jobs yet — <a class="back" href="#/submit">submit one →</a></div></div>`;return}
    const rows=jobs.map(j=>`<tr class="row" onclick="location.hash='#/jobs/${esc(j.id)}'">
      <td class="name">${esc(j.name)}</td>
      <td>${phaseEl(j.phase)}</td>
      <td><span class="badge d-${esc(j.delivery)}">${esc(j.delivery)}</span></td>
      <td class="mono-dim">${esc((g(j.graph,'Operators','operators')||[]).length)} ops</td>
      <td class="mono-dim">${esc(fmtTime(j.createdAt))}</td>
    </tr>`).join('');
    app.innerHTML=`<div class="panel"><div class="hd">Jobs</div>
      <table><thead><tr><th>Name</th><th>Phase</th><th>Delivery</th><th>Pipeline</th><th>Created</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  },2000);
}

/* ---- job detail ---- */
async function viewDetail(id){
  setNav(null);
  poll(async()=>{
    let d;try{d=await api.job(id)}catch(e){app.innerHTML=`<div class="err">job not found</div>`;stopPoll();return}
    if(d.error){app.innerHTML=`<div class="err">${esc(d.error)}</div>`;stopPoll();return}
    const job=d.job, run=d.latestRun, logs=await api.logs(id);
    const phase=(run&&run.phase)||'—';
    // Only a live (non-terminal) job has a control surface to query.
    const isTerm=['finished','failed','cancelled'].includes((phase||'').toLowerCase());
    const st=isTerm?null:await api.state(id);
    document.getElementById('count').textContent=job.name;
    const live=st?[
      ['phase',phaseEl(st.phase)],
      ['records in',`<span class="big">${esc(st.recordsIn||0)}</span>`],
      ['records out',`<span class="big">${esc(st.recordsOut||0)}</span>`],
      ['uptime',esc(st.uptime||'—')],
      ['checkpoint',esc(st.currentCheckpointId||'—')],
    ]:[['phase',phaseEl(phase)],['status','<span class="mono-dim">not running — no live control surface</span>']];
    const trs=(d.transitions||[]).slice(-14).reverse().map(t=>
      `<div class="r"><b>${esc(t.to)}</b><span>${esc(t.reason||'')}</span><span class="at">${esc(fmtTime(t.at))}</span></div>`).join('')
      ||'<div class="mono-dim">no transitions</div>';
    const term=isTerm;
    app.innerHTML=`
      <a class="back" href="#/jobs">← all jobs</a>
      <div style="display:flex;align-items:flex-end;gap:16px;margin:12px 0 20px">
        <div><h1>${esc(job.name)}</h1><div class="sub">${esc(job.id)}</div></div>
        <span class="badge d-${esc(job.delivery)}" style="margin-bottom:4px">${esc(job.delivery)}</span>
        <div class="btns" style="margin-left:auto">
          <button class="btn" ${term?'disabled':''} onclick="doSavepoint('${esc(id)}')">Savepoint</button>
          <button class="btn" onclick="doRestart('${esc(id)}')">Restart</button>
          <button class="btn danger" ${term?'disabled':''} onclick="doCancel('${esc(id)}')">Cancel</button>
        </div>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <div class="panel" style="grid-column:1/3"><div class="hd">Pipeline</div>${graphEl(job.graph)}</div>
        <div class="panel"><div class="hd">Live</div><dl class="kv">${live.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl></div>
        <div class="panel"><div class="hd">Lifecycle</div><div class="tl">${trs}</div></div>
        <div class="panel" style="grid-column:1/3"><div class="hd">Logs</div><pre class="log" id="log">${esc(logs||'(no output yet)')}</pre></div>
      </div>`;
    const lg=document.getElementById('log');if(lg)lg.scrollTop=lg.scrollHeight;
  },1600);
}

async function doCancel(id){if(!confirm('Cancel this job?'))return;await api.act(id,'cancel');}
async function doRestart(id){
  const sp=prompt('Restart from savepoint label? (blank = from last checkpoint)','');
  if(sp===null)return;
  await api.act(id,'restart',sp?{savepoint:sp}:null);
}
async function doSavepoint(id){
  const label=prompt('Savepoint label (stops the job with a savepoint):','');
  if(!label)return;
  const r=await api.act(id,'savepoint?label='+encodeURIComponent(label));
  if(!r.ok){const j=await r.json().catch(()=>({}));alert('Savepoint failed: '+(j.error||r.status))}
}

/* ---- submit ---- */
function viewSubmit(){
  setNav('submit');stopPoll();
  app.innerHTML=`
    <h1>Submit workflow</h1>
    <div class="sub" style="margin:4px 0 18px">Paste a YAML workflow. Preview compiles it (dry-run) before deploy.</div>
    <div class="panel"><div class="hd">Workflow (YAML)</div>
      <div style="padding:14px">
        <textarea id="wf" rows="16" spellcheck="false" placeholder="name: my-job
version: &quot;1&quot;
source:
  type: generator
  records: [{key: a, value: '{&quot;n&quot;:1}'}]
pipeline:
  - {id: by-n, type: keyBy, keyBy: {field: n, partitions: 1}}
  - {id: count, type: reduce, reduce: {function: count}}
sink: {type: stdout}"></textarea>
        <div class="btns" style="margin-top:12px">
          <button class="btn" onclick="doPreview()">Preview</button>
          <button class="btn pri" id="deploy" onclick="doDeploy()" disabled>Deploy</button>
        </div>
        <div id="pv" style="margin-top:14px"></div>
      </div>
    </div>`;
}
async function doPreview(){
  const wf=document.getElementById('wf').value;const pv=document.getElementById('pv');
  const r=await api.validate({workflow:wf});const j=await r.json();
  if(!r.ok){pv.innerHTML=`<div class="err">${esc(j.error||'invalid')}</div>`;document.getElementById('deploy').disabled=true;return}
  pv.innerHTML=`<div class="panel"><div class="hd">Preview — ${esc(j.name)} · <span class="d-${esc(j.delivery)}">${esc(j.delivery)}</span></div>${graphEl(j.graph)}</div>`;
  document.getElementById('deploy').disabled=false;
}
async function doDeploy(){
  const wf=document.getElementById('wf').value;
  const r=await api.submit({workflow:wf});const j=await r.json();
  if(!r.ok){document.getElementById('pv').innerHTML=`<div class="err">${esc(j.error||'submit failed')}</div>`;return}
  const id=(j.job&&j.job.id)||j.id;location.hash='#/jobs/'+id;
}

/* ---- routing ---- */
function setNav(v){document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  if(v!=='jobs')document.getElementById('count').textContent=''}
function fmtTime(s){if(!s)return '—';const d=new Date(s);return isNaN(d)?s:d.toLocaleString([], {month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function route(){
  const h=location.hash.replace(/^#/,'')||'/jobs';
  const m=h.match(/^\/jobs\/(.+)$/);
  if(m)return viewDetail(m[1]);
  if(h==='/submit')return viewSubmit();
  return viewJobs();
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
