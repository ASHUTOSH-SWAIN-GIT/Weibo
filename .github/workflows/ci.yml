name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build all packages
        run: go build ./...

      - name: Build example pipelines
        run: go build ./examples/...

      - name: Build controller
        working-directory: control
        run: go build ./...

  fmt-vet:
    name: fmt + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Check controller formatting
        working-directory: control
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::unformatted controller files:"
            echo "$out"
            exit 1
          fi

      - name: Vet controller
        working-directory: control
        run: go vet ./...

  test:
    name: test (race detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Run tests with race detector
        run: go test -race ./test/unit_tests/...

      - name: Run window/watermark tests with race detector
        run: go test -race ./test/unit_tests/window/... ./test/unit_tests/watermark/...

      - name: Test controller with race detector
        working-directory: control
        run: go test -short -race ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Run tests with coverage
        run: go test -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./test/unit_tests/...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: Controller coverage
        working-directory: control
        run: go test -short -coverprofile=control-coverage.out -covermode=atomic ./...

      - name: Upload controller coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-coverage
          path: control/control-coverage.out
          retention-days: 7

  controller-docker-integration:
    name: controller SDK Docker integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: control/go.sum

      - name: Build SDK test image
        run: docker build -t weibo-sdk-demo:test examples/sdk-demo

      - name: Run SDK lifecycle integration
        working-directory: control
        run: go test -count=1 -run TestIntegration_SDKImageLifecycle .
