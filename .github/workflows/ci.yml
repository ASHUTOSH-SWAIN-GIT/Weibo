name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build all packages
        run: go build ./...

      - name: Build example pipelines
        run: go build ./examples/...

      - name: Build controller
        working-directory: control
        run: go build ./...

  fmt-vet:
    name: fmt + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Check controller formatting
        working-directory: control
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::unformatted controller files:"
            echo "$out"
            exit 1
          fi

      - name: Vet controller
        working-directory: control
        run: go vet ./...

  test:
    name: test (race detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Test controller with race detector
        working-directory: control
        run: go test -short -race ./...

  kubernetes:
    name: kubernetes (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: control/go.sum

      - name: Vet Kubernetes controller
        working-directory: control
        run: go vet -tags kubernetes ./...

      - name: Test Kubernetes controller with race detector
        working-directory: control
        run: go test -short -race -tags kubernetes ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Run tests with coverage
        run: go test -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: Controller coverage
        working-directory: control
        run: go test -short -coverprofile=control-coverage.out -covermode=atomic ./...

      - name: Upload controller coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-coverage
          path: control/control-coverage.out
          retention-days: 7

  controller-docker-integration:
    name: controller SDK Docker integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: control/go.sum

      - name: Build SDK test image
        run: docker build -f examples/sdk-demo/Dockerfile.integration -t weibo-sdk-demo:test .

      - name: Run SDK lifecycle integration
        working-directory: control
        run: go test -count=1 -run TestIntegration_SDKImageLifecycle .

  security:
    name: dependency + artifact security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck root module
        run: govulncheck ./...

      - name: govulncheck control module
        working-directory: control
        run: govulncheck ./...

      - name: Build runner image for scanning
        run: docker build -f Dockerfile.runner -t weibo-runner:ci .

      - name: Scan runner image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: weibo-runner:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload container scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30
