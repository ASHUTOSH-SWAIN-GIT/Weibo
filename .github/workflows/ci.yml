name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build all packages
        run: go build ./...

      - name: Build example pipelines
        run: go build ./examples/...

      - name: Build controller
        working-directory: control
        run: go build ./...

      - name: Build telemetry
        working-directory: telemetry
        run: go build ./...

  fmt-vet:
    name: fmt + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Check controller formatting
        working-directory: control
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::unformatted controller files:"
            echo "$out"
            exit 1
          fi

      - name: Vet controller
        working-directory: control
        run: go vet ./...

      - name: Vet telemetry
        working-directory: telemetry
        run: go vet ./...

  static:
    name: static checks (workflows, Dockerfiles, shell, YAML, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML for YAML validation
        run: pip install --quiet pyyaml

      - name: Run repo static checks (same script as `make check-static`)
        run: ./scripts/check-static.sh

  test:
    name: test (race detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Test controller with race detector
        working-directory: control
        run: go test -short -race ./...

      - name: Test telemetry with race detector
        working-directory: telemetry
        run: go test -race ./...

      - name: Offline integration tiers (fakes; no live backends)
        run: go test -count=1 ./test/integration/...

  kubernetes:
    name: kubernetes (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: control/go.sum

      - name: Vet Kubernetes controller
        working-directory: control
        run: go vet -tags kubernetes ./...

      - name: Test Kubernetes controller with race detector
        working-directory: control
        run: go test -short -race -tags kubernetes ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The changed-package gate diffs against origin/main.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      - name: Run tests with coverage
        run: go test -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: Controller coverage (untagged + kubernetes-tagged backend)
        working-directory: control
        run: |
          go test -short -coverprofile=control-coverage.out -covermode=atomic ./...
          go test -short -tags kubernetes -coverprofile=control-coverage-k8s.out -covermode=atomic ./backend/...
          grep -v '^mode: ' control-coverage-k8s.out >> control-coverage.out
          rm control-coverage-k8s.out

      - name: Upload controller coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controller-coverage
          path: control/control-coverage.out
          retention-days: 7

      - name: Telemetry coverage
        working-directory: telemetry
        run: go test -coverprofile=telemetry-coverage.out -covermode=atomic ./...

      - name: Upload telemetry coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-coverage
          path: telemetry/telemetry-coverage.out
          retention-days: 7

      - name: Changed-package coverage gate (roadmap #27)
        run: ./scripts/check-coverage.sh --gate --base origin/main

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      - name: Run every fuzz target briefly (same script as `make fuzz-smoke`)
        run: ./scripts/fuzz-smoke.sh 10s

  controller-docker-integration:
    name: controller SDK Docker integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: control/go.sum

      - name: Build SDK test image
        run: docker build -f examples/sdk-demo/Dockerfile.integration -t weibo-sdk-demo:test .

      - name: Run SDK lifecycle integration
        working-directory: control
        run: go test -count=1 -run TestIntegration_SDKImageLifecycle .

  security:
    name: dependency + artifact security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck root module
        run: govulncheck ./...

      - name: govulncheck control module
        working-directory: control
        run: govulncheck ./...

      - name: govulncheck telemetry module
        working-directory: telemetry
        run: govulncheck ./...

      - name: Build runner image for scanning
        run: docker build -f Dockerfile.runner -t weibo-runner:ci .

      - name: Scan runner image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: weibo-runner:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload container scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30
