name: kafka-e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kafka-e2e:
    name: kafka end-to-end
    runs-on: ubuntu-latest

    services:
      kafka:
        image: apache/kafka:3.7.0
        env:
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: 'broker,controller'
          KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
          KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
          KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
          KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
          KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2QkM0RUUxM0VCOEUwQjlGQjY='
        ports:
          - 9092:9092

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install Java (for Kafka CLI tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless

      # The kafka service container already holds the full distribution, so the
      # CLI tools are copied out of it rather than downloaded. The previous
      # source, archive.apache.org, is Apache's unmirrored legacy archive and
      # stalls for tens of minutes at a time, hanging this job with it.
      - name: Install Kafka CLI tools
        run: |
          cid=$(docker ps --filter 'ancestor=apache/kafka:3.7.0' --format '{{.ID}}' | head -1)
          if [ -z "$cid" ]; then
            cid=$(docker ps --format '{{.ID}} {{.Image}}' | awk '/apache\/kafka/ {print $1; exit}')
          fi
          if [ -z "$cid" ]; then
            echo "::error::kafka service container not found"
            docker ps -a
            exit 1
          fi
          docker cp "$cid:/opt/kafka" "$HOME/kafka"
          if [ ! -x "$HOME/kafka/bin/kafka-topics.sh" ]; then
            echo "::error::kafka CLI tools missing from the service container image"
            ls -la "$HOME/kafka" "$HOME/kafka/bin" 2>&1 || true
            exit 1
          fi
          echo "$HOME/kafka/bin" >> $GITHUB_PATH
          echo "KAFKA_BIN=$HOME/kafka/bin" >> $GITHUB_ENV

      - name: Wait for Kafka
        run: |
          for i in {1..60}; do
            if kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "kafka is up"
              exit 0
            fi
            echo "waiting... ($i)"
            sleep 2
          done
          echo "kafka failed to start"
          kafka-topics.sh --bootstrap-server localhost:9092 --list || true
          exit 1

      - name: Run kafka e2e test
        env:
          KAFKA_BROKERS: localhost:9092
        run: ./scripts/test-kafka.sh

      - name: Test multi-topic checkpoint restore
        env:
          KAFKA_BROKERS: localhost:9092
        run: go test -count=1 -run TestKafkaMultiTopicCheckpointRestore ./source

      - name: Test deterministic transaction marker recovery
        env:
          KAFKA_BROKERS: localhost:9092
        run: go test -count=1 -run TestTxnKafkaMarkerProbeIntegration ./sink
