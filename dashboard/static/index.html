<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailer Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Mailer Dashboard</h1>
        <div id="status-bar" class="status-bar">
            <span id="status-indicator" class="status-dot stopped"></span>
            <span id="status-text">Stopped</span>
            <span id="uptime" class="uptime"></span>
        </div>
    </header>

    <main>
        <section id="counts" class="counts">
            <div class="counter">
                <span class="counter-label">Records In</span>
                <span id="records-in" class="counter-value">0</span>
            </div>
            <div class="counter">
                <span class="counter-label">Records Out</span>
                <span id="records-out" class="counter-value">0</span>
            </div>
        </section>

        <section id="pipeline-graph" class="pipeline-graph">
            <p class="loading">Loading pipeline...</p>
        </section>

        <section id="error-display" class="error-display hidden">
            <h3>Error</h3>
            <pre id="error-text"></pre>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
